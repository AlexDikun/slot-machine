<div class="slot-machine__reels">
  <div class="slot-machine__row" *ngFor="let row of reels">
    <div class="slot-machine__symbol" *ngFor="let symbol of row">
      <img [src]="symbol.icon" [alt]="symbol.name" class="slot-machine__icon">
    </div>
  </div>
</div>
<button class="slot-machine__spin-button" (click)="spin()">Спин!</button>
